<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Продукты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#f3dcdc;
  --bg2:#e7bcbc;
  --card:#fff;
  --accent:#b23a3a;
  --text:#1a1a1a;
  --muted:#666;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  padding-bottom:90px;
}

.screen{display:none}
.screen.active{display:block}

/* HEADER */
.header{padding:24px 20px 10px}
.header-top{display:flex;justify-content:space-between;align-items:center}
.header h1{margin:0;font-size:28px;font-weight:700}
.search-btn{
  width:44px;height:44px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
}

/* CHIPS */
.chips{display:flex;gap:12px;margin-top:18px}
.chip{
  padding:10px 18px;border-radius:22px;
  background:#ffffffaa;font-weight:600
}
.chip.active{background:#ffd84d}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  padding:20px;
}
.card{
  background:var(--card);
  border-radius:22px;
  padding:12px;
}
.card img{width:100%;height:110px;object-fit:contain}
.card h4{margin:12px 0 4px}
.card span{color:var(--muted)}

/* PRODUCT */
.product-img{width:100%;height:260px;object-fit:contain}
.product-content{padding:20px}
.qty{display:flex;gap:12px;align-items:center;margin:16px 0}
.qty button{
  width:40px;height:40px;border-radius:12px;border:none;
  background:var(--accent);color:#fff;font-size:18px
}
.btn{
  background:var(--accent);color:#fff;border:none;
  padding:14px;border-radius:22px;width:100%;font-size:16px
}

/* CART */
.cart-item{
  background:#fff;margin:12px;border-radius:18px;padding:14px
}
.cart-total{padding:20px;font-weight:700}

/* NAV */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:70px;
  background:#fff;display:flex;border-top:1px solid #ddd
}
.bottom-nav button{
  flex:1;border:none;background:none;
  display:flex;flex-direction:column;align-items:center;
  font-size:12px;color:#999
}
.bottom-nav button.active{color:var(--accent)}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="header">
    <div class="header-top">
      <h1>Ежедневные продукты</h1>
      <div class="search-btn">🔍</div>
    </div>
    <div class="chips">
      <div class="chip active">Фрукты</div>
      <div class="chip">Овощи</div>
    </div>
  </div>

  <div class="products" id="products"></div>
</div>

<!-- PRODUCT -->
<div id="product" class="screen">
  <img id="pImg" class="product-img">
  <div class="product-content">
    <h2 id="pName"></h2>
    <p id="pPrice"></p>

    <div class="qty">
      <button onclick="changeQty(-1)">−</button>
      <span id="qty">1</span>
      <button onclick="changeQty(1)">+</button>
    </div>

    <button class="btn" onclick="addToCart()">Добавить в корзину</button>
    <button class="btn" style="background:#ccc;color:#000;margin-top:10px"
      onclick="show('home')">Назад</button>
  </div>
</div>

<!-- CART -->
<div id="cart" class="screen">
  <div id="cartItems"></div>
  <div class="cart-total" id="cartTotal"></div>
  <button class="btn" onclick="checkout()">Оформить заказ</button>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <p style="padding:20px">👤 Профиль пользователя</p>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <button id="nav-home" class="active" onclick="nav('home')">🏠<div>Главная</div></button>
  <button id="nav-cart" onclick="nav('cart')">🛒<div>Корзина</div></button>
  <button id="nav-profile" onclick="nav('profile')">👤<div>Профиль</div></button>
</div>

<script>
Telegram.WebApp.expand();

const data=[
 {id:1,name:"Банан",price:50000,img:"https://pngimg.com/uploads/banana/banana_PNG842.png"},
 {id:2,name:"Апельсин",price:70000,img:"https://pngimg.com/uploads/orange/orange_PNG820.png"},
 {id:3,name:"Ананас",price:120000,img:"https://pngimg.com/uploads/pineapple/pineapple_PNG2756.png"},
 {id:4,name:"Лимон",price:80000,img:"https://pngimg.com/uploads/lemon/lemon_PNG25270.png"}
];

let current=null,qty=1,cart=[];

const box=document.getElementById("products");
data.forEach(p=>{
  box.innerHTML+=`
  <div class="card" onclick="openProduct(${p.id})">
    <img src="${p.img}">
    <h4>${p.name}</h4>
    <span>${p.price} сум / кг</span>
  </div>`;
});

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function nav(id){
  show(id);
  document.querySelectorAll(".bottom-nav button").forEach(b=>{
    b.classList.remove("active");
  });
  document.getElementById("nav-"+id).classList.add("active");
}

function openProduct(id){
 current=data.find(p=>p.id===id);
 qty=1;document.getElementById("qty").innerText=qty;
 pImg.src=current.img;
 pName.innerText=current.name;
 pPrice.innerText=current.price+" сум / кг";
 show("product");
}

function changeQty(v){
 qty=Math.max(1,qty+v);
 document.getElementById("qty").innerText=qty;
}

function addToCart(){
  cart.push({...current,qty});
  renderCart();
  nav('cart');
}

function renderCart(){
 cartItems.innerHTML="";
 let total=0;
 cart.forEach(i=>{
  total+=i.price*i.qty;
  cartItems.innerHTML+=`
   <div class="cart-item">
    ${i.name} — ${i.qty} кг
   </div>`;
 });
 cartTotal.innerText="Итого: "+total+" сум";
}

function checkout(){
 Telegram.WebApp.sendData(JSON.stringify(cart));
 Telegram.WebApp.close();
}
</script>

</body>
</html>

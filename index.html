<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Premium Food</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --primary:#8b1d1d;
  --bg:#f4f4f4;
  --dark:#111;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--dark);
  padding-bottom:80px;
}

header{
  background:var(--primary);
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:600;
}

.screen{display:none}
.screen.active{display:block}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card-body{padding:10px}

.price{
  color:var(--primary);
  font-weight:600;
}

/* BUTTON */
button{
  border:none;
  border-radius:18px;
  background:var(--primary);
  color:#fff;
  padding:14px;
  width:100%;
  font-size:16px;
}

/* CATEGORY */
.category{
  background:#fff;
  margin:12px;
  padding:16px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.07);
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  display:flex;
  border-top:1px solid #ddd;
}

.bottom-nav button{
  flex:1;
  background:none;
  color:#555;
  font-size:14px;
}

.bottom-nav button.active{
  color:var(--primary);
  font-weight:600;
}
</style>
</head>

<body>

<header id="header">🍽 Premium Food</header>

<!-- SCREENS -->

<div id="catalog" class="screen active">
  <button onclick="show('categories')" style="margin:12px">Категории</button>
  <div class="products" id="products"></div>
</div>

<div id="categories" class="screen">
  <div class="category" onclick="filterCategory('all')">Все</div>
  <div class="category" onclick="filterCategory('burgers')">Бургеры</div>
  <div class="category" onclick="filterCategory('pizza')">Пицца</div>
  <div class="category" onclick="filterCategory('drinks')">Напитки</div>
  <div class="category" onclick="filterCategory('desserts')">Десерты</div>
  <button onclick="show('catalog')" style="margin:12px;background:#ccc;color:#000">Назад</button>
</div>

<div id="favorites" class="screen">
  <p style="padding:16px">❤️ Избранные (будет на этапе 2)</p>
</div>

<div id="cart" class="screen">
  <p style="padding:16px">🛒 Корзина (уже есть, доработаем)</p>
</div>

<div id="profile" class="screen">
  <p style="padding:16px">👤 Профиль</p>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button id="nav-home" class="active" onclick="nav('catalog')">Главная</button>
  <button id="nav-fav" onclick="nav('favorites')">Избранные</button>
  <button id="nav-cart" onclick="nav('cart')">Корзина</button>
  <button id="nav-profile" onclick="nav('profile')">Профиль</button>
</div>

<script>
const tg = Telegram.WebApp;
tg.expand();

const productsData = [
  {id:1,name:"Бургер",price:45000,cat:"burgers",img:"https://picsum.photos/300?1"},
  {id:2,name:"Пицца",price:60000,cat:"pizza",img:"https://picsum.photos/300?2"},
  {id:3,name:"Кола",price:15000,cat:"drinks",img:"https://picsum.photos/300?3"},
  {id:4,name:"Торт",price:30000,cat:"desserts",img:"https://picsum.photos/300?4"}
];

const productsBox = document.getElementById("products");

function renderProducts(list){
  productsBox.innerHTML="";
  list.forEach(p=>{
    productsBox.innerHTML+=`
      <div class="card">
        <img src="${p.img}">
        <div class="card-body">
          <h4>${p.name}</h4>
          <div class="price">${p.price} сум</div>
        </div>
      </div>`;
  });
}

renderProducts(productsData);

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function nav(id){
  show(id);
  document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));
  document.getElementById("nav-"+(id==="catalog"?"home":id)).classList.add("active");
}

function filterCategory(cat){
  show("catalog");
  nav("catalog");
  if(cat==="all") renderProducts(productsData);
  else renderProducts(productsData.filter(p=>p.cat===cat));
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ежедневные продукты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#f3dcdc;
  --bg2:#e7bcbc;
  --card:#fff;
  --accent:#b23a3a;
  --text:#1a1a1a;
  --muted:#666;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:#fff;
  height:100vh;
  overflow:hidden; /* 🔥 КЛЮЧ */
}

.screen{
  display:none;
  height:calc(100vh - 70px); /* ⬅ высота без нижнего меню */
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  overflow-y:auto;           /* ⬅ скролл ТОЛЬКО здесь */
  padding-bottom:20px;
}

.screen.active{
  display:block;
}

  #cart{
  display:flex;
  flex-direction:column;
}

/* ⛔ favorites НЕ flex */
#favorites{
  display:block;
}
  
@keyframes fade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* HEADER */
.header{padding:24px 20px 10px}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h1{margin:0;font-size:28px;font-weight:700}

.search-btn{
  width:44px;height:44px;border-radius:50%;
  background:#fff;display:flex;
  align-items:center;justify-content:center;
  cursor:pointer;
}

/* SEARCH */
.search-box{
  margin:12px 20px;
  display:none;
}
.search-box input{
  width:100%;
  padding:12px 16px;
  border-radius:18px;
  border:none;
  font-size:16px;
}

/* CHIPS */
.chips{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 20px;
}
.chip{
  padding:8px 16px;
  border-radius:20px;
  background:#ffffffaa;
  white-space:nowrap;
  font-weight:600;
  cursor:pointer;
}
.chip.active{
  background:#ffd84d;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  padding:20px;
}

  #favorites .products{
  display:grid;
  }
  
.card{
  background:var(--card);
  border-radius:22px;
  padding:12px;
  position:relative;
}
.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}
.card h4{margin:12px 0 4px}
.card span{color:var(--muted);font-size:14px}

/* FAVORITE */
.fav{
  position:absolute;
  top:10px;
  right:10px;
  font-size:18px;
  cursor:pointer;
}
.fav.active{color:red}

/* PRODUCT */
.product-img{width:100%;height:260px;object-fit:contain}
.product-content{padding:20px}
.qty{
  display:flex;
  gap:12px;
  align-items:center;
  margin:16px 0;
}
.qty button{
  width:40px;height:40px;
  border-radius:12px;
  border:none;
  background:var(--accent);
  color:#fff;
  font-size:18px;
}
.btn{
  background:var(--accent);
  color:#fff;
  border:none;
  padding:14px;
  border-radius:22px;
  width:100%;
  font-size:16px;
}

/* CART */
.cart-item{
  background:#fff;
  margin:12px;
  border-radius:18px;
  padding:14px;
}
.cart-total{
  padding:20px;
  font-weight:700;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;left:0;right:0;
  height:70px;
  background:#fff;
  display:flex;
  border-top:1px solid #ddd;
}
.bottom-nav button{
  flex:1;
  border:none;
  background:none;
  font-size:12px;
  color:#999;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.bottom-nav button.active{color:var(--accent)}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="header">
    <div class="header-top">
      <h1>Ежедневные продукты</h1>
      <div class="search-btn" onclick="toggleSearch()">🔍</div>
    </div>
  </div>

  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="Поиск..." oninput="renderProducts()">
  </div>

  <div class="chips" id="chips"></div>
  <div class="products" id="products"></div>
</div>

<!-- PRODUCT -->
<div id="product" class="screen">
  <img id="pImg" class="product-img">
  <div class="product-content">
    <h2 id="pName"></h2>
    <p id="pPrice"></p>

    <div class="qty">
      <button onclick="changeQty(-1)">−</button>
      <span id="qty">1</span>
      <button onclick="changeQty(1)">+</button>
    </div>

    <button class="btn" onclick="addToCart()">В корзину</button>
    <button class="btn" style="background:#ccc;color:#000;margin-top:10px"
      onclick="show('home')">Назад</button>
  </div>
</div>

<!-- CART -->
<div id="cart" class="screen">
  <div id="cartItems"></div>
  <div class="cart-total" id="cartTotal"></div>
  <button class="btn" onclick="preparePayment()">Оплатить</button>
</div>

<!-- FAVORITES -->
<div id="favorites" class="screen">
  <div class="products" id="favProducts"></div>
</div>

<!-- NAV -->
<div class="bottom-nav">
  <button id="nav-home" class="active" onclick="nav('home')">🏠<div>Главная</div></button>
  <button id="nav-fav" onclick="nav('favorites')">❤️<div>Избранные</div></button>
  <button id="nav-cart" onclick="nav('cart')">🛒<div>Корзина</div></button>
</div>

<script>
Telegram.WebApp.expand();

/* DATA */
const categories=["Все","Напитки","Овощи","Фрукты","Сладости","Молочные продукты","Сухие продукты"];

const data=[
 {id:1,name:"Банан",price:50000,cat:"Фрукты",img:"https://pngimg.com/uploads/banana/banana_PNG842.png"},
 {id:2,name:"Молоко",price:12000,cat:"Молочные продукты",img:"https://pngimg.com/uploads/milk/milk_PNG12749.png"},
 {id:3,name:"Хлеб",price:8000,cat:"Сухие продукты",img:"https://pngimg.com/uploads/bread/bread_PNG2287.png"},
 {id:4,name:"Сок",price:15000,cat:"Напитки",img:"https://pngimg.com/uploads/orange_juice/orange_juice_PNG721.png"},
 {id:5,name:"Яблоко",price:40000,cat:"Фрукты",img:"https://pngimg.com/uploads/apple/apple_PNG12405.png"}
];

let current=null;
let qty=1;
let cart=[];
let favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
let activeCategory="Все";

/* CATEGORIES */
const chipsBox=document.getElementById("chips");
categories.forEach(c=>{
  const el=document.createElement("div");
  el.className="chip"+(c==="Все"?" active":"");
  el.innerText=c;
  el.onclick=()=>selectCategory(c,el);
  chipsBox.appendChild(el);
});

/* RENDER PRODUCTS */
function renderProducts(){
 const box=document.getElementById("products");
 const q=document.getElementById("searchInput").value.toLowerCase();
 box.innerHTML="";

 data.filter(p=>{
   return (activeCategory==="Все"||p.cat===activeCategory) &&
          p.name.toLowerCase().includes(q);
 }).forEach(p=>{
   box.innerHTML+=`
    <div class="card">
      <div class="fav ${favorites.includes(p.id)?"active":""}"
 onclick="event.stopPropagation(); toggleFav(${p.id})">❤️</div>
        <img src="${p.img}">
        <h4>${p.name}</h4>
        <span>${p.price} сум</span>
      </div>
    </div>`;
 });
}

/* RENDER FAVORITES */
function renderFavorites(){
  const box = document.getElementById("favProducts");
  if(!box) return; // 🔥 КРИТИЧНО

  box.innerHTML="";

  if(favorites.length === 0){
    box.innerHTML = "<p style='padding:20px'>Нет избранных товаров</p>";
    return;
  }

  data.forEach(p=>{
    if(favorites.includes(p.id)){
      box.innerHTML += `
        <div class="card">
          <div class="fav ${favorites.includes(p.id)?"active":""}"
 onclick="event.stopPropagation(); toggleFav(${p.id})">❤️</div>
            <img src="${p.img}">
            <h4>${p.name}</h4>
            p.price.toLocaleString() + " сум"
          </div>
        </div>
      `;
    }
  });
}

/* LOGIC */
function toggleSearch(){
  const searchBox = document.getElementById("searchBox");
  searchBox.style.display =
    searchBox.style.display === "block" ? "none" : "block";
}

function selectCategory(c,el){
 activeCategory=c;
 document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
 el.classList.add("active");
 renderProducts();
}

function toggleFav(id){
 favorites = favorites.includes(id)
   ? favorites.filter(x=>x!==id)
   : [...favorites,id];

 localStorage.setItem("favorites", JSON.stringify(favorites));

 renderProducts();
 renderFavorites(); // ← ВАЖНО
}

function openProduct(id){
 current=data.find(p=>p.id===id);
 qty=1;
 pImg.src=current.img;
 pName.innerText=current.name;
 pPrice.innerText=current.price+" сум";
 document.getElementById("qty").innerText=qty;
 show("product");
}

function changeQty(v){
 qty=Math.max(1,qty+v);
 document.getElementById("qty").innerText=qty;
}

function addToCart(){
  const item = cart.find(i => i.id === current.id);
  if(item){
    item.qty += qty;
  } else {
    cart.push({...current, qty});
  }
  renderCart();
  nav("cart");
}

function renderCart(){
 cartItems.innerHTML="";
 let total=0;
 cart.forEach(i=>{
  total+=i.price*i.qty;
  cartItems.innerHTML+=`
   <div class="cart-item">${i.name} — ${i.qty}</div>`;
 });
 cartTotal.innerText="Итого: "+total+" сум";
}

function preparePayment(){
 alert("Оплата будет подключена через Telegram Payments");
}

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function nav(id){
  // сначала показываем экран
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  // активная кнопка
  document.querySelectorAll(".bottom-nav button")
    .forEach(b=>b.classList.remove("active"));

  document.getElementById("nav-"+(id==="favorites"?"fav":id))
    .classList.add("active");

  // 🔥 РЕНДЕР ТОЛЬКО ПОСЛЕ ПОКАЗА
  if(id === "favorites"){
    renderFavorites();
  }

  if(id === "cart"){
    renderCart();
  }
}

/* INIT */
renderProducts();
</script>

</body>
</html>

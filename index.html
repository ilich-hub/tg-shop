<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Продукты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --red1:#7a1b1b;
  --red2:#b23a3a;
  --chip:#ffffffcc;
  --card:#ffffff;
  --text:#1a1a1a;
  --muted:#666;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#f3dcdc 0%, #e7bcbc 40%, #f5f5f5 100%);
  padding-bottom:90px;
  color:var(--text);
}

/* HEADER */
.header{
  padding:24px 20px 10px;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h1{
  font-size:28px;
  margin:0;
  font-weight:700;
}

.search-btn{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

/* CHIPS */
.chips{
  display:flex;
  gap:12px;
  margin-top:18px;
}

.chip{
  padding:10px 18px;
  border-radius:22px;
  background:#ffffff88;
  font-weight:600;
}

.chip.active{
  background:#ffd84d;
}

/* SUBTITLE */
.subtitle{
  margin:22px 20px 12px;
  font-size:20px;
  font-weight:700;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  padding:0 20px;
}

.card{
  background:var(--card);
  border-radius:22px;
  padding:12px;
}

.card img{
  width:100%;
  height:110px;
  object-fit:contain;
}

.card h4{
  margin:12px 0 4px;
  font-size:16px;
}

.card span{
  color:var(--muted);
  font-size:14px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#fff;
  display:flex;
  border-top:1px solid #ddd;
}

.bottom-nav button{
  flex:1;
  border:none;
  background:none;
  font-size:12px;
  color:#999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.bottom-nav button.active{
  color:var(--red2);
}
</style>
</head>

<body>

<div class="header">
  <div class="header-top">
    <h1>Ежедневные продукты</h1>
    <div class="search-btn">🔍</div>
  </div>

  <div class="chips">
    <div class="chip active">Фрукты</div>
    <div class="chip">Овощи</div>
  </div>
</div>

<div class="subtitle">Найдите больше фруктов!</div>

<div class="products">
  <div class="card">
    <img src="https://pngimg.com/uploads/banana/banana_PNG842.png">
    <h4>Банан</h4>
    <span>50 000 сум / кг</span>
  </div>

  <div class="card">
    <img src="https://pngimg.com/uploads/orange/orange_PNG820.png">
    <h4>Апельсин</h4>
    <span>70 000 сум / кг</span>
  </div>

  <div class="card">
    <img src="https://pngimg.com/uploads/pineapple/pineapple_PNG2756.png">
    <h4>Ананас</h4>
    <span>120 000 сум / кг</span>
  </div>

  <div class="card">
    <img src="https://pngimg.com/uploads/lemon/lemon_PNG25270.png">
    <h4>Лимон</h4>
    <span>80 000 сум / кг</span>
  </div>
</div>

<div class="bottom-nav">
  <button class="active">🏠<div>Главная</div></button>
  <button>❤️<div>Избранное</div></button>
  <button>🛒<div>Корзина</div></button>
  <button>👤<div>Профиль</div></button>
</div>

<script>
Telegram.WebApp.expand();
</script>

</body>
</html>

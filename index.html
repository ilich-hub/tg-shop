<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Premium Food</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --primary:#8b1d1d;
  --bg:#f4f4f4;
  --dark:#111;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--dark);
}

header{
  background:var(--primary);
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:20px;
  font-weight:600;
}

/* SCREENS */
.screen{display:none}
.screen.active{display:block}

/* CATALOG */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card-body{
  padding:10px;
}

.card-body h4{
  margin:0;
  font-size:15px;
}

.price{
  margin-top:6px;
  color:var(--primary);
  font-weight:600;
}

/* BUTTONS */
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:18px;
  background:var(--primary);
  color:#fff;
  font-size:16px;
  margin-top:12px;
}

/* PRODUCT SCREEN */
.product-img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.product-content{
  padding:16px;
}

.qty{
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:10px;
}

.qty button{
  width:40px;
  height:40px;
  border-radius:12px;
  padding:0;
}

/* CART */
.cart-item{
  background:#fff;
  margin:10px;
  padding:12px;
  border-radius:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.07);
}

.cart-item h4{margin:0}
.cart-total{
  padding:16px;
  font-weight:600;
}
</style>
</head>

<body>

<header id="header">🍽 Premium Food</header>

<!-- CATALOG -->
<div id="catalog" class="screen active">
  <div class="products" id="products"></div>
</div>

<!-- PRODUCT -->
<div id="product" class="screen">
  <img id="pImg" class="product-img">
  <div class="product-content">
    <h2 id="pName"></h2>
    <p id="pDesc"></p>
    <p class="price" id="pPrice"></p>

    <div class="qty">
      <button onclick="changeQty(-1)">−</button>
      <span id="qty">1</span>
      <button onclick="changeQty(1)">+</button>
    </div>

    <button onclick="addToCart()">Добавить в корзину</button>
    <button onclick="goCatalog()" style="background:#ccc;color:#000">Назад</button>
  </div>
</div>

<!-- CART -->
<div id="cart" class="screen">
  <div id="cartItems"></div>
  <div class="cart-total" id="cartTotal"></div>
  <button onclick="checkout()">Оформить заказ</button>
  <button onclick="goCatalog()" style="background:#ccc;color:#000">Назад</button>
</div>

<script>
const tg = Telegram.WebApp;
tg.expand();

const products = Array.from({length:50},(_,i)=>({
  id:i,
  name:`Блюдо ${i+1}`,
  desc:`Премиум блюдо №${i+1}, свежие ингредиенты.`,
  price:30000 + i*1500,
  img:`https://picsum.photos/400/300?food=${i}`
}));

let currentProduct = null;
let quantity = 1;
let cart = [];

const screens = {
  catalog:document.getElementById("catalog"),
  product:document.getElementById("product"),
  cart:document.getElementById("cart")
};

function show(name){
  Object.values(screens).forEach(s=>s.classList.remove("active"));
  screens[name].classList.add("active");
  document.getElementById("header").innerText =
    name==="catalog"?"🍽 Premium Food":
    name==="cart"?"🛒 Корзина":"🍽 Детали";
}

function goCatalog(){show("catalog")}
function goCart(){renderCart();show("cart")}

const productsBox = document.getElementById("products");
products.forEach(p=>{
  productsBox.innerHTML += `
    <div class="card" onclick="openProduct(${p.id})">
      <img src="${p.img}">
      <div class="card-body">
        <h4>${p.name}</h4>
        <div class="price">${p.price} сум</div>
      </div>
    </div>
  `;
});

function openProduct(id){
  currentProduct = products.find(p=>p.id===id);
  quantity = 1;
  document.getElementById("qty").innerText = quantity;
  pImg.src = currentProduct.img;
  pName.innerText = currentProduct.name;
  pDesc.innerText = currentProduct.desc;
  pPrice.innerText = currentProduct.price + " сум";
  show("product");
}

function changeQty(v){
  quantity = Math.max(1, quantity+v);
  document.getElementById("qty").innerText = quantity;
}

function addToCart(){
  const item = cart.find(i=>i.id===currentProduct.id);
  if(item) item.qty += quantity;
  else cart.push({...currentProduct, qty:quantity});
  goCart();
}

function renderCart(){
  const box = document.getElementById("cartItems");
  box.innerHTML = "";
  let total = 0;

  cart.forEach(i=>{
    total += i.price * i.qty;
    box.innerHTML += `
      <div class="cart-item">
        <h4>${i.name}</h4>
        <p>${i.qty} × ${i.price} сум</p>
      </div>
    `;
  });

  cartTotal.innerText = "Итого: " + total + " сум";
}

function checkout(){
  tg.sendData(JSON.stringify(cart));
  tg.close();
}
</script>

</body>
</html>
